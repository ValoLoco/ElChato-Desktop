[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:novnc]
command=/usr/bin/websockify --log=/var/log/novnc.log 6080 --vnc localhost:5900
autostart=true
autorestart=true
stderr_logfile=/var/log/novnc.err.log
stdout_logfile=/var/log/novnc.out.log

[program:xvfb]
command=/usr/bin/Xvfb :99 -screen 0 1920x1080x24 -ac +extension GLX +render -noreset
autostart=true
autorestart=true
stderr_logfile=/var/log/xvfb.err.log
stdout_logfile=/var/log/xvfb.out.log

[program:fluxbox]
command=/usr/bin/fluxbox
environment=DISPLAY=":99"
autostart=true
autorestart=true
stderr_logfile=/var/log/fluxbox.err.log
stdout_logfile=/var/log/fluxbox.out.log

[program:elchato]
command=/opt/elchato/start-elchato.sh
environment=DISPLAY=":99"
autostart=true
autorestart=true
stderr_logfile=/var/log/elchato.err.log
stdout_logfile=/var/log/elchato.out.log
startretries=3
startsecs=10
